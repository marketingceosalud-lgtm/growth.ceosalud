<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEO Salud · Extractor de comprobantes</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --teal-deep:#1c6f6a;
    --teal:#2a9d96;
    --teal-light:#63c2bb;
    --teal-pale:#e7f5f4;
    --ink:#123c39;
    --white:#ffffff;
    --danger:#c0503f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:linear-gradient(160deg,var(--teal-pale) 0%, #f5faf9 55%, #ffffff 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{
    width:100%;
    background:linear-gradient(120deg, var(--teal-deep), var(--teal) 60%, var(--teal-light));
    padding:22px 24px;
    display:flex;
    align-items:center;
    gap:16px;
    box-shadow:0 4px 18px rgba(18,60,57,0.18);
  }
  header img{ height:42px; }
  header .titulo{
    color:var(--white);
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:.2px;
    border-left:1px solid rgba(255,255,255,.35);
    padding-left:16px;
  }
  header .titulo small{
    display:block;
    font-weight:400;
    font-size:.78rem;
    opacity:.85;
  }

  main{
    width:100%;
    max-width:560px;
    padding:32px 20px 60px;
  }

  .card{
    background:var(--white);
    border-radius:18px;
    padding:28px;
    box-shadow:0 10px 30px rgba(18,60,57,0.08);
    border:1px solid #e3efee;
  }

  .drop{
    border:2px dashed var(--teal-light);
    border-radius:14px;
    padding:36px 16px;
    text-align:center;
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease;
    background:var(--teal-pale);
  }
  .drop.dragover{
    background:#dcf1ef;
    border-color:var(--teal);
  }
  .drop svg{ margin-bottom:10px; }
  .drop p{ margin:4px 0; }
  .drop .principal{ font-weight:600; color:var(--teal-deep); }
  .drop .secundario{ font-size:.85rem; color:#5c7a78; }

  input[type=file]{ display:none; }

  .preview{
    margin-top:16px;
    text-align:center;
  }
  .preview img{
    max-height:180px;
    border-radius:10px;
    border:1px solid #e3efee;
  }

  .estado{
    margin-top:18px;
    text-align:center;
    font-size:.92rem;
    color:#5c7a78;
    min-height:1.2em;
  }
  .estado.error{ color:var(--danger); font-weight:600; }

  .resultado{
    margin-top:20px;
    display:none;
  }
  .resultado.visible{ display:block; animation:aparecer .25s ease; }
  @keyframes aparecer{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .resultado label{
    display:block;
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--teal-deep);
    font-weight:700;
    margin-bottom:8px;
  }
  .caja-numero{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--teal-pale);
    border:1px solid var(--teal-light);
    border-radius:12px;
    padding:14px 16px;
  }
  .caja-numero span{
    flex:1;
    font-family:'Consolas','SFMono-Regular',monospace;
    font-size:1.3rem;
    font-weight:700;
    color:var(--ink);
    letter-spacing:.5px;
    word-break:break-all;
  }
  .btn-copiar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--teal);
    color:var(--white);
    border:none;
    border-radius:9px;
    padding:10px 14px;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .btn-copiar:hover{ background:var(--teal-deep); }
  .btn-copiar:active{ transform:scale(.96); }
  .btn-copiar.copiado{ background:#3f9b52; }

  details{
    margin-top:18px;
  }
  details summary{
    cursor:pointer;
    color:#5c7a78;
    font-size:.82rem;
  }
  details pre{
    white-space:pre-wrap;
    background:#f5faf9;
    border:1px solid #e3efee;
    border-radius:8px;
    padding:10px;
    font-size:.78rem;
    color:#375855;
    max-height:220px;
    overflow:auto;
  }

  footer{
    color:#7a9997;
    font-size:.78rem;
    padding-bottom:24px;
  }
</style>
</head>
<body>

  <header>
    <img src="https://ceosalud.pe/wp-content/uploads/2026/01/LOGO-CEO-SALUD_BLANCO-scaled.png" alt="CEO Salud">
    <div class="titulo">
      Extractor de comprobantes de pago
      <small>Uso interno · Personal CEO Salud</small>
    </div>
  </header>

  <main>
    <div class="card">

      <div class="drop" id="dropZone">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2a9d96" stroke-width="1.6">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="principal">Arrastra la captura de pago aquí</p>
        <p class="secundario">o haz clic para elegir un archivo</p>
        <input type="file" id="fileInput" accept="image/*">
      </div>

      <div class="preview" id="preview" style="display:none">
        <img id="previewImg" alt="Captura cargada">
      </div>

      <div class="estado" id="estado"></div>

      <div class="resultado" id="resultado">
        <label>Número de operación detectado</label>
        <div class="caja-numero">
          <span id="numeroDetectado">—</span>
          <button class="btn-copiar" id="btnCopiar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="12" height="12" rx="2"/>
              <path d="M5 15V5a2 2 0 0 1 2-2h10" stroke-linecap="round"/>
            </svg>
            <span id="btnCopiarTexto">Copiar</span>
          </button>
        </div>
      </div>

      <details>
        <summary>Ver texto reconocido (para revisar si algo falla)</summary>
        <pre id="debugTexto">—</pre>
      </details>

    </div>

    <footer style="text-align:center;margin-top:18px">CEO Salud · Confianza y Bienestar</footer>
  </main>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const estado = document.getElementById('estado');
  const resultado = document.getElementById('resultado');
  const numeroDetectado = document.getElementById('numeroDetectado');
  const debugTexto = document.getElementById('debugTexto');
  const btnCopiar = document.getElementById('btnCopiar');
  const btnCopiarTexto = document.getElementById('btnCopiarTexto');

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) procesarArchivo(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) procesarArchivo(fileInput.files[0]);
  });

  function pareceFechaUOtroRuido(token) {
    return /^\d{1,2}[\/\-]\d{1,2}/.test(token) ||
           /^\d{1,2}:\d{2}/.test(token) ||
           (/^\d{4}$/.test(token) && Number(token) > 1900 && Number(token) < 2100);
  }

  function extraerNumeroOperacion(rawText) {
    const flat = rawText.replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, ' ').trim();
    const etiquetaRegex = /\b(?:n(?:úmero|ro|°)\.?\s*(?:de\s*)?)(operaci[oó]n|transferencia)\s*[:\-]?\s*/gi;

    const candidatos = [];
    let m;
    while ((m = etiquetaRegex.exec(flat)) !== null) {
      const tipoEtiqueta = m[1].toLowerCase().startsWith('operaci') ? 0 : 1;
      const resto = flat.slice(m.index + m[0].length, m.index + m[0].length + 40);
      const tokenMatch = resto.match(/^([A-Z0-9]{4,20})(?:\s+([A-Z0-9]{2,10}))?/i);
      if (!tokenMatch) continue;
      const primerToken = tokenMatch[1];
      if (pareceFechaUOtroRuido(primerToken)) continue;
      const valor = (tokenMatch[1] + (tokenMatch[2] || '')).toUpperCase();
      candidatos.push({ prioridad: tipoEtiqueta, valor });
    }

    if (candidatos.length > 0) {
      candidatos.sort((a, b) => a.prioridad - b.prioridad);
      return candidatos[0].valor;
    }

    const regexesRespaldo = [
      /\d{3}\.\d{3}\.\d{3}\.\d{4}/,
      /\b\d{6,15}\b/,
      /\b[A-Z0-9]{6,20}\b/
    ];
    for (const r of regexesRespaldo) {
      const mm = flat.match(r);
      if (mm) return mm[0];
    }
    return null;
  }

  async function procesarArchivo(file) {
    resultado.classList.remove('visible');
    estado.classList.remove('error');
    debugTexto.textContent = '—';

    previewImg.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    estado.textContent = 'Leyendo la imagen… puede tardar unos segundos';

    try {
      const { data: { text } } = await Tesseract.recognize(file, 'spa', {
        logger: (info) => {
          if (info.status === 'recognizing text') {
            estado.textContent = `Leyendo la imagen… ${Math.round(info.progress * 100)}%`;
          }
        }
      });

      debugTexto.textContent = text || '(sin texto detectado)';
      const numero = extraerNumeroOperacion(text);

      if (numero) {
        estado.textContent = '';
        numeroDetectado.textContent = numero;
        resultado.classList.add('visible');
        btnCopiar.classList.remove('copiado');
        btnCopiarTexto.textContent = 'Copiar';
      } else {
        estado.textContent = 'No se encontró un número de operación en esta imagen. Revisa el texto reconocido abajo.';
        estado.classList.add('error');
      }
    } catch (err) {
      console.error('Error de OCR:', err);
      estado.textContent = 'Ocurrió un error al leer la imagen: ' + (err && err.message ? err.message : err);
      estado.classList.add('error');
    }
  }

  btnCopiar.addEventListener('click', async () => {
    const valor = numeroDetectado.textContent;
    if (!valor || valor === '—') return;
    try {
      await navigator.clipboard.writeText(valor);
    } catch (e) {
      // Respaldo por si el navegador bloquea el portapapeles (ej. sin HTTPS)
      const area = document.createElement('textarea');
      area.value = valor;
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      document.body.removeChild(area);
    }
    btnCopiar.classList.add('copiado');
    btnCopiarTexto.textContent = 'Copiado ✓';
    setTimeout(() => {
      btnCopiar.classList.remove('copiado');
      btnCopiarTexto.textContent = 'Copiar';
    }, 1800);
  });
</script>
</body>
</html>
